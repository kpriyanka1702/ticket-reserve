services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ticketreserve
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket
      MYSQL_ROOT_PASSWORD: localroot
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocalroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
